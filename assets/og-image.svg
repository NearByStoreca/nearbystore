<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Near-Buy social preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="240" fill="#ffffff" opacity=".06"/>
  <circle cx="180" cy="560" r="200" fill="#ffffff" opacity=".05"/>

  <g transform="translate(96,150)">
    <rect width="64" height="64" rx="16" fill="#ffffff" opacity=".18"/>
    <text x="88" y="44" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Near-Buy</text>

    <text y="150" font-family="system-ui, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Stop overpaying</text>
    <text y="226" font-family="system-ui, sans-serif" font-size="66" font-weight="800" fill="#ffffff">at the checkout.</text>

    <text y="300" font-family="system-ui, sans-serif" font-size="26" fill="#d1fae5">Scan your receipt. See what the same basket</text>
    <text y="340" font-family="system-ui, sans-serif" font-size="26" fill="#d1fae5">costs at stores near you.</text>

    <text y="418" font-family="system-ui, sans-serif" font-size="15" fill="#bbf7d0" letter-spacing="2">PLACEHOLDER SOCIAL PREVIEW</text>
  </g>
</svg>
