<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NearBuyStore social preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <clipPath id="og-awning">
      <path d="M10 14h44v12q-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0z"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="240" fill="#ffffff" opacity=".06"/>
  <circle cx="180" cy="560" r="200" fill="#ffffff" opacity=".05"/>

  <g transform="translate(96,150)">
    <!-- brand mark: shopfront under a striped awning, signed N -->
    <g>
      <rect width="64" height="64" rx="16" fill="#ffffff" opacity=".18"/>
      <path d="M14 26h36v23a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="#ffffff"/>
      <path d="M22 48V33h5l10 10V33h5v15h-5L27 38v10z" fill="#15803d"/>
      <g clip-path="url(#og-awning)">
        <rect x="10" y="14" width="44" height="18" fill="#ffffff"/>
        <rect x="21" y="14" width="11" height="18" fill="#f59e0b"/>
        <rect x="43" y="14" width="11" height="18" fill="#f59e0b"/>
      </g>
      <path d="M54 26q-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0"
            fill="none" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="88" y="44" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff">NearBuyStore</text>

    <text y="150" font-family="system-ui, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Stop guessing where</text>
    <text y="226" font-family="system-ui, sans-serif" font-size="66" font-weight="800" fill="#ffffff">your money goes.</text>

    <text y="300" font-family="system-ui, sans-serif" font-size="26" fill="#d1fae5">Upload your receipt. Every line item read,</text>
    <text y="340" font-family="system-ui, sans-serif" font-size="26" fill="#d1fae5">totalled and tracked over time.</text>

    <text y="418" font-family="system-ui, sans-serif" font-size="15" fill="#bbf7d0" letter-spacing="2">PLACEHOLDER SOCIAL PREVIEW &#183; APPS COMING SOON</text>
  </g>
</svg>
