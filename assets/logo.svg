<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NearBuyStore logo">
  <defs>
    <linearGradient id="nbs-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <!-- Scalloped shop awning; the stripes below are painted through it. -->
    <clipPath id="nbs-awning">
      <path d="M10 14h44v12q-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0z"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#nbs-tile)"/>

  <!-- shop face -->
  <path d="M14 26h36v23a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="#fff"/>

  <!-- the N of NearBuyStore, as the shop's sign -->
  <path d="M22 48V33h5l10 10V33h5v15h-5L27 38v10z" fill="#15803d"/>

  <!-- striped awning, drawn last so it sits over the shop face -->
  <g clip-path="url(#nbs-awning)">
    <rect x="10" y="14" width="44" height="18" fill="#fff"/>
    <rect x="21" y="14" width="11" height="18" fill="#f59e0b"/>
    <rect x="43" y="14" width="11" height="18" fill="#f59e0b"/>
  </g>
  <!-- Without this the white stripes bleed straight into the white shop face
       and only the amber scallops read. -->
  <path d="M54 26q-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0-5.5 4.5-11 0"
        fill="none" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
</svg>
