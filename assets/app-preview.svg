<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" role="img" aria-label="Placeholder app screenshot: a scanned receipt broken into individual line items">
  <defs>
    <clipPath id="screen"><rect x="14" y="14" width="292" height="592" rx="32"/></clipPath>
  </defs>

  <!-- phone body -->
  <rect x="0" y="0" width="320" height="620" rx="46" fill="#0f172a"/>
  <rect x="14" y="14" width="292" height="592" rx="32" fill="#f8fafc"/>

  <g clip-path="url(#screen)">
    <!-- status bar -->
    <rect x="14" y="14" width="292" height="46" fill="#ffffff"/>
    <text x="36" y="43" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">9:41</text>
    <rect x="248" y="30" width="22" height="11" rx="3" fill="#0f172a" opacity=".75"/>

    <!-- header -->
    <rect x="14" y="60" width="292" height="74" fill="#16a34a"/>
    <text x="36" y="92"  font-family="system-ui, sans-serif" font-size="12" fill="#bbf7d0">Receipt scanned &#183; 14 Aug</text>
    <text x="36" y="115" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Big Bazaar</text>

    <!-- totals callout -->
    <rect x="34" y="152" width="252" height="80" rx="16" fill="#eaf7ef" stroke="#16a34a" stroke-width="1.5"/>
    <text x="52" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">Receipt total</text>
    <text x="52" y="212" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#15803d">$44.90</text>
    <text x="270" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#15803d" text-anchor="end">12 items</text>
    <circle cx="252" cy="200" r="20" fill="#16a34a"/>
    <path d="M244 200l6 6 12-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- line items label -->
    <text x="36" y="264" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ITEMS READ</text>

    <!-- item rows: factual detail only, no cross-store claims -->
    <g font-family="system-ui, sans-serif" font-size="13">
      <rect x="34" y="278" width="252" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="50" y="300" fill="#0f172a" font-weight="600">Milk 1L &#215;2</text>
      <text x="50" y="316" fill="#64748b" font-size="11">$3.10 each</text>
      <text x="270" y="307" fill="#0f172a" font-weight="700" text-anchor="end">$6.20</text>

      <rect x="34" y="332" width="252" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="50" y="354" fill="#0f172a" font-weight="600">Rice 5kg</text>
      <text x="50" y="370" fill="#64748b" font-size="11">Basmati, 1 bag</text>
      <text x="270" y="361" fill="#0f172a" font-weight="700" text-anchor="end">$16.40</text>

      <rect x="34" y="386" width="252" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="50" y="408" fill="#0f172a" font-weight="600">Cooking oil 1L</text>
      <text x="50" y="424" fill="#64748b" font-size="11">Sunflower, 1 bottle</text>
      <text x="270" y="415" fill="#0f172a" font-weight="700" text-anchor="end">$7.10</text>

      <rect x="34" y="440" width="252" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="50" y="462" fill="#0f172a" font-weight="600">Eggs &#215;12</text>
      <text x="50" y="478" fill="#64748b" font-size="11">One dozen</text>
      <text x="270" y="469" fill="#0f172a" font-weight="700" text-anchor="end">$4.30</text>
    </g>

    <!-- scan button -->
    <rect x="34" y="506" width="252" height="52" rx="26" fill="#16a34a"/>
    <text x="160" y="538" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Scan a receipt</text>

    <text x="160" y="583" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5">PLACEHOLDER SCREENSHOT</text>
  </g>

  <rect x="120" y="20" width="80" height="20" rx="10" fill="#0f172a"/>
</svg>
