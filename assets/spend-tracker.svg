<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" role="img" aria-label="Placeholder app screenshot: monthly spend tracker showing $412.60 spent in August, broken down by category — Groceries $248.30, Household $74.20, Personal care $52.10, Snacks $38.00">
  <defs>
    <clipPath id="screen-spend"><rect x="14" y="14" width="292" height="592" rx="32"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="620" rx="46" fill="#0f172a"/>
  <rect x="14" y="14" width="292" height="592" rx="32" fill="#f8fafc"/>

  <g clip-path="url(#screen-spend)">
    <!-- status bar -->
    <rect x="14" y="14" width="292" height="46" fill="#ffffff"/>
    <text x="36" y="43" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">9:41</text>
    <rect x="248" y="30" width="22" height="11" rx="3" fill="#0f172a" opacity=".75"/>

    <!-- header -->
    <rect x="14" y="60" width="292" height="74" fill="#16a34a"/>
    <text x="36" y="92"  font-family="system-ui, sans-serif" font-size="12" fill="#bbf7d0">Spend tracker</text>
    <text x="36" y="115" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">August</text>

    <!-- hero number: the headline is a single value, so it is not a chart -->
    <text x="36" y="176" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Total so far this month</text>
    <text x="36" y="222" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#0f172a" letter-spacing="-1.5">$412.60</text>
    <text x="36" y="246" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">across 9 receipts</text>

    <line x1="34" y1="272" x2="286" y2="272" stroke="#e2e8f0" stroke-width="1"/>

    <text x="36" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">BY CATEGORY</text>

    <!-- Horizontal bars. Single hue: length encodes magnitude, the label
         carries identity, so no categorical palette is involved. Every bar
         is directly labelled, so no legend or axis is needed. -->
    <g font-family="system-ui, sans-serif" font-size="13">
      <!-- Groceries 248.30 -> full 252px -->
      <text x="36"  y="330" fill="#0f172a" font-weight="600">Groceries</text>
      <text x="284" y="330" fill="#0f172a" font-weight="700" text-anchor="end">$248.30</text>
      <rect x="34" y="340" width="252" height="10" rx="5" fill="#f1f5f9"/>
      <rect x="34" y="340" width="252" height="10" rx="5" fill="#16a34a"/>

      <!-- Household 74.20 -> 75px -->
      <text x="36"  y="386" fill="#0f172a" font-weight="600">Household</text>
      <text x="284" y="386" fill="#0f172a" font-weight="700" text-anchor="end">$74.20</text>
      <rect x="34" y="396" width="252" height="10" rx="5" fill="#f1f5f9"/>
      <rect x="34" y="396" width="75"  height="10" rx="5" fill="#16a34a"/>

      <!-- Personal care 52.10 -> 53px -->
      <text x="36"  y="442" fill="#0f172a" font-weight="600">Personal care</text>
      <text x="284" y="442" fill="#0f172a" font-weight="700" text-anchor="end">$52.10</text>
      <rect x="34" y="452" width="252" height="10" rx="5" fill="#f1f5f9"/>
      <rect x="34" y="452" width="53"  height="10" rx="5" fill="#16a34a"/>

      <!-- Snacks 38.00 -> 39px -->
      <text x="36"  y="498" fill="#0f172a" font-weight="600">Snacks</text>
      <text x="284" y="498" fill="#0f172a" font-weight="700" text-anchor="end">$38.00</text>
      <rect x="34" y="508" width="252" height="10" rx="5" fill="#f1f5f9"/>
      <rect x="34" y="508" width="39"  height="10" rx="5" fill="#16a34a"/>
    </g>

    <text x="160" y="583" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5">PLACEHOLDER SCREENSHOT</text>
  </g>

  <rect x="120" y="20" width="80" height="20" rx="10" fill="#0f172a"/>
</svg>
